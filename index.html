<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KES2 Holidays - Around the World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>KES2 Holidays</h1>
    <p>Package holidays you can trust</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Pupil Portal</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="new">New Customer (Lesson 1)</button>
        <button class="tab-btn" data-tab="return">Returning Customer</button>
      </div>

      <div id="new" class="tab active">
        <label>First name
          <input id="firstName" type="text" maxlength="30" placeholder="e.g. Aisha" />
        </label>
        <p class="helper">Choose exactly 5 transport modes. Use at least 3 different types. No option more than twice.</p>
        <div id="transportOptions" class="transport-grid"></div>
        <div id="selectedTransport" class="chips"></div>
        <button id="generateCodeBtn">Generate Travel Code</button>
        <p id="newCodeOutput" class="code"></p>
      </div>

      <div id="return" class="tab">
        <label>Enter travel code
          <input id="travelCodeInput" type="text" placeholder="KES2-XXXXXX-L1" />
        </label>
      </div>

      <div class="actions">
        <button id="revealBtn">Reveal Next Destination</button>
      </div>
      <p id="statusMsg" class="status"></p>

      <div id="loader" class="loader hidden">
        <p>Searching worldwide deals...</p>
        <div class="progress-wrap"><div id="progressBar" class="progress"></div></div>
        <p id="progressText">0%</p>
      </div>

      <div id="result" class="result hidden"></div>
    </section>

    <section class="card">
      <h2>Teacher Login</h2>
      <label>Password
        <input id="teacherPassword" type="password" placeholder="Teacher password" />
      </label>
      <label>Original travel code
        <input id="teacherCode" type="text" placeholder="KES2-XXXXXX" />
      </label>
      <button id="teacherViewBtn">View Full Itinerary</button>
      <div id="teacherResult" class="result hidden"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
